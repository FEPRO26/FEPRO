<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FEPRO">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FEPRO · Translator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #00e5a0;
    --accent2: #00b3ff;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --danger: #ff4d6d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  header {
    height: 56px;
    padding: 0 16px;
    padding-top: env(safe-area-inset-top);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 20px;
  }

  .app-wrapper {
    display: flex;
    flex-direction: column;
    height: calc(100dvh - 56px - env(safe-area-inset-top));
    overflow: hidden;
  }

  .type-bar {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .type-btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 8px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
  }

  .type-btn.active {
    background: rgba(0, 229, 160, 0.1);
    border-color: var(--accent);
    color: var(--accent);
  }

  .panels {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    border-bottom: 1px solid var(--border);
  }

  .panel:last-child { border-bottom: none; }

  .panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .panel-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .lang-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .lang-pill.en {
    background: rgba(0, 179, 255, 0.12);
    color: var(--accent2);
    border: 1px solid rgba(0, 179, 255, 0.25);
  }

  .lang-pill.ro {
    background: rgba(0, 229, 160, 0.12);
    color: var(--accent);
    border: 1px solid rgba(0, 229, 160, 0.25);
  }

  .input-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--card);
  }

  textarea {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    resize: none;
    padding: 14px 16px;
    min-height: 0;
  }

  textarea::placeholder { color: var(--muted); }

  .upload-zone {
    margin: 0 12px 12px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .upload-zone:active { border-color: var(--accent); background: rgba(0,229,160,0.04); }
  .upload-zone.has-image { padding: 0; overflow: hidden; border-color: var(--accent); }
  .upload-zone img { width: 100%; max-height: 90px; object-fit: contain; border-radius: 8px; }

  .upload-icon { font-size: 18px; }
  .upload-text { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .upload-sub { font-size: 10px; color: var(--muted); opacity: 0.6; }
  #imageInput { display: none; }

  .output-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    background: var(--bg);
  }

  .output-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    opacity: 0.3;
  }

  .output-placeholder .big-icon { font-size: 32px; }
  .output-placeholder p { font-size: 13px; color: var(--muted); }

  .output-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .action-bar {
    flex-shrink: 0;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 44px;
    height: 44px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .clear-btn:active { border-color: var(--danger); color: var(--danger); }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    height: 44px;
    padding: 0 14px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .copy-btn:active { border-color: var(--accent2); color: var(--accent2); }
  .copy-btn.copied { border-color: var(--accent); color: var(--accent); }

  .translate-btn {
    flex: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #000;
    height: 44px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.18s;
  }
  .translate-btn:active { opacity: 0.85; }
  .translate-btn:disabled { opacity: 0.45; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .translate-btn.loading .spinner { display: block; }
  .translate-btn.loading .btn-text { display: none; }

  .error-msg {
    background: rgba(255,77,109,0.1);
    border: 1px solid rgba(255,77,109,0.3);
    color: #ff8fa3;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
  }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (min-width: 768px) {
    .panels { flex-direction: row; }
    .panel { border-bottom: none; border-right: 1px solid var(--border); }
    .panel:last-child { border-right: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">FOTBAL · RO</div>
  <div class="badge">Translator Editorial</div>
</header>

<div class="app-wrapper">

  <div class="type-bar">
    <button class="type-btn active" data-type="news" onclick="setType('news')">⚠️ Știre standard</button>
    <button class="type-btn" data-type="official" onclick="setType('official')">📃 Comunicat oficial</button>
  </div>

  <div class="action-bar">
    <button class="clear-btn" onclick="clearAll()" title="Șterge tot">🗑️</button>
    <button class="copy-btn" id="copyBtn" onclick="copyOutput()">📋 Copiază</button>
    <button class="translate-btn" id="translateBtn" onclick="runTranslation()">
      <div class="spinner"></div>
      <span class="btn-text">Traduce →</span>
    </button>
  </div>

  <div class="panels">

    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Text sursă</span>
        <span class="lang-pill en">🇬🇧 English</span>
      </div>
      <div class="input-body">
        <textarea id="sourceText" placeholder="Lipește textul în engleză…"></textarea>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="imageInput" accept="image/*">
          <div class="upload-icon">🖼️</div>
          <div class="upload-text">Upload imagine / screenshot</div>
          <div class="upload-sub">PNG · JPG · WEBP</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-label">Traducere</span>
        <span class="lang-pill ro">🇷🇴 Română</span>
      </div>
      <div class="output-body">
        <div class="output-placeholder" id="placeholder">
          <div class="big-icon">⚡</div>
          <p>Traducerea apare aici</p>
        </div>
        <div class="output-text" id="outputText" style="display:none;"></div>
      </div>
    </div>

  </div>

</div>

<script>
  // Register service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  let postType = 'news';
  let uploadedImageBase64 = null;
  let uploadedImageType = null;
  let translatedText = '';

  function setType(type) {
    postType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-type="' + type + '"]').classList.add('active');
  }

  const uploadZone = document.getElementById('uploadZone');
  const imageInput = document.getElementById('imageInput');

  uploadZone.addEventListener('click', () => document.getElementById('imageInput').click());
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); });
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleImage(file);
  });

  imageInput.addEventListener('change', e => {
    if (e.target.files[0]) handleImage(e.target.files[0]);
  });

  function handleImage(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      const dataUrl = ev.target.result;
      uploadedImageBase64 = dataUrl.split(',')[1];
      uploadedImageType = file.type;
      uploadZone.classList.add('has-image');
      uploadZone.innerHTML =
        '<img src="' + dataUrl + '" alt="Uploaded">' +
        '<div style="padding:5px;text-align:center;font-size:11px;color:var(--muted);">Apasă pentru a schimba</div>';
      uploadZone.onclick = () => {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*';
        inp.onchange = e2 => { if (e2.target.files[0]) handleImage(e2.target.files[0]); };
        inp.click();
      };
    };
    reader.readAsDataURL(file);
  }

  function clearAll() {
    document.getElementById('sourceText').value = '';
    uploadedImageBase64 = null;
    uploadedImageType = null;
    translatedText = '';
    uploadZone.classList.remove('has-image');
    uploadZone.innerHTML =
      '<input type="file" id="imageInput" accept="image/*">' +
      '<div class="upload-icon">🖼️</div>' +
      '<div class="upload-text">Upload imagine / screenshot</div>' +
      '<div class="upload-sub">PNG · JPG · WEBP</div>';
    document.getElementById('imageInput').addEventListener('change', e => {
      if (e.target.files[0]) handleImage(e.target.files[0]);
    });
    uploadZone.onclick = () => document.getElementById('imageInput').click();
    document.getElementById('outputText').style.display = 'none';
    document.getElementById('outputText').innerHTML = '';
    document.getElementById('placeholder').style.display = 'flex';
  }

  function copyOutput() {
    if (!translatedText) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(translatedText)
        .then(showCopied)
        .catch(() => fallbackCopy());
    } else {
      fallbackCopy();
    }
  }

  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = translatedText;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); showCopied(); } catch(e) {}
    document.body.removeChild(ta);
  }

  function showCopied() {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ Copiat!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copiază'; btn.classList.remove('copied'); }, 2000);
  }

  async function runTranslation() {
    const sourceText = document.getElementById('sourceText').value.trim();
    if (!sourceText && !uploadedImageBase64) return;

    const btn = document.getElementById('translateBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    translatedText = '';

    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('outputText').style.display = 'block';
    document.getElementById('outputText').innerHTML = '<span class="cursor"></span>';

    const emoji = postType === 'official' ? '📃' : '⚠️';

    const systemPrompt = 'Ești un editor de știri sportive în română. Traduci și adaptezi știri despre fotbal (Premier League și alte competiții) respectând STRICT regulile editoriale de mai jos.\n\nREGULI EDITORIALE OBLIGATORII:\n\n1. FORMAT POSTARE:\n- Începe întotdeauna cu ' + emoji + '\n- Text compact. Știre scurtă → un singur paragraf. Știre lungă → EXACT 2 paragrafe, rupte la un punct logic narativ: Paragraf 1 = informația principală / anunțul; Paragraf 2 = detalii suplimentare / context / consecințe. NICIODATĂ mai mult de 2 paragrafe.\n- Un singur rând liber între cele 2 paragrafe.\n- Sursa la finalul ultimului paragraf, pe aceeași linie, în paranteze drepte [Sursa]\n\n2. STIL LIMBAJ - Formulări directe și scurte:\n- "este" → "e"\n- "însă" → "dar"\n- "aceasta/acest/această" → "asta/ăsta"\n- "acest sezon" → "sezonul actual"\n- "anul acesta" → "anul ăsta"\n- "în această lună" → "luna asta"\n- "în această fereastră" → "fereastra asta"\n- "viitorul său/situația sa/împrumutul său/în locul său" → viitorul lui / situația lui / împrumutul lui / în locul lui\n\n3. TRADUCEREA CITATELOR:\n- Traduce citatele EXACT, 1:1\n- Nu rezuma declarații\n- Adaptează doar stilul (ex: "este" → "e")\n\n4. TERMINOLOGIE STANDARD:\n- "hamstring injury" → "problemă musculară"\n- "illness" → rămâne "illness" (nu se traduce)\n- "taxa de transfer" → "suma de transfer"\n- "medical" → "vizita medicală"\n- "cârcei" → "crampe"\n- "ischiogambieri" → "problemă musculară"\n\n5. FORMAT NUMERIC:\n- Sume de transfer: €40m, £25m, $20m (NU "40 de milioane de euro")\n\n6. FORMAT VÂRSTĂ:\n- Vârsta în paranteză: Pedro Neto (25 ani)\n\n7. DENUMIRI CLUBURI:\n- Tottenham Hotspur → Tottenham\n- Manchester United → Man United\n- Manchester City → Man City\n- Brighton & Hove Albion → Brighton\n- SAFC → Sunderland\n- Hashtag-urile (#CFC etc.) → numele clubului\n\n8. STRUCTURA ȘTIRE:\nOrdinea: Context principal → Detaliu important → Explicație/consecință → Sursă\n\nRăspunde DOAR cu textul tradus, gata de publicat. Nicio explicație, niciun comentariu.';

    const userContent = [];
    if (uploadedImageBase64) {
      userContent.push({ type: 'image', source: { type: 'base64', media_type: uploadedImageType, data: uploadedImageBase64 } });
    }
    userContent.push({
      type: 'text',
      text: sourceText ? 'Traduce și adaptează conform regulilor editoriale:\n\n' + sourceText : 'Extrage textul din imagine și traduce-l conform regulilor editoriale.'
    });

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: 'user', content: userContent }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      translatedText = data.content.map(b => b.text || '').join('');

      const outputEl = document.getElementById('outputText');
      outputEl.innerHTML = '';
      let i = 0;
      const cur = document.createElement('span');
      cur.className = 'cursor';

      function typeChar() {
        if (i < translatedText.length) {
          outputEl.textContent = translatedText.slice(0, i + 1);
          outputEl.appendChild(cur);
          i++;
          setTimeout(typeChar, 10);
        } else {
          outputEl.textContent = translatedText;
        }
      }
      typeChar();

    } catch (err) {
      document.getElementById('outputText').innerHTML =
        '<div class="error-msg">❌ Eroare: ' + err.message + '</div>';
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
